<!DOCTYPE html>
<html>
<head>
    <title>My Account - BMM Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
            flex-direction: column;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">BMM Translation</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/speaker">Speaker</a>
                <a href="/audience">Audience</a>
                <a href="/streams">Active Streams</a>
                <a href="/contact">Contact</a>
                <a href="/account">Account</a>
            </div>
            <span id="user-email" class="user-email"></span>
            <a id="login-btn" href="/login" class="auth-button">Sign In</a>
            <a id="logout-btn" href="/logout" class="auth-button" style="display: none;">Logout</a>
        </div>
    </nav>

    <div class="center-content" id="account-content">
        <p>Loading account details...</p>
    </div>

    <script>
        const emailSpan = document.getElementById("user-email");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const accountContent = document.getElementById("account-content");

        fetch("/session")
            .then(res => res.json())
            .then(data => {
                const email = data.email;
                const loggedIn = !!email;

                // Navbar display logic
                if (loggedIn) {
                    emailSpan.textContent = email;
                    loginBtn.style.display = "none";
                    logoutBtn.style.display = "inline";
                } else {
                    emailSpan.textContent = "";
                    loginBtn.style.display = "inline";
                    logoutBtn.style.display = "none";
                }

                // Account page debug display
                accountContent.innerHTML = `
                    <h2>Account Status</h2>
                    <p><strong>Logged In:</strong> ${loggedIn}</p>
                    <p><strong>Email:</strong> ${email ? email : "None"}</p>
                `;
            })
            .catch(err => {
                console.error("Error fetching session info:", err);
                accountContent.innerHTML = `
                    <h2>Error loading account data</h2>
                    <p>Unable to retrieve session information.</p>
                `;
            });
    </script>
</body>
</html>
