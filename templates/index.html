<!DOCTYPE html>
<html>
<head>
    <title>BMM Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">BMM Translation</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/speaker">Speaker</a>
                <a href="/audience">Audience</a>
                <a href="/streams">Active Streams</a>
                <a href="/contact">Contact</a>
                <a href="/account">Account</a>
            </div>
            <span id="user-email" class="user-email"></span>
            <a id="login-btn" href="/login" class="auth-button">Sign In</a>
            <a id="logout-btn" href="/logout" class="auth-button" style="display: none;">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="hero-section">
            <h1 class="hero-title">BMM Translation</h1>
            <p class="hero-subtitle">Real-time translation for seamless communication</p>
            <div class="button-group">
                <a href="/speaker" class="button">I'm a Speaker</a>
                <a href="/audience" class="button">I'm in the Audience</a>
            </div>
        </div>
    </div>
    <script>
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const emailSpan = document.getElementById("user-email");
    
        // Redirect back to the same page after login
        if (loginBtn) {
        loginBtn.href = `/login?from=${encodeURIComponent(window.location.pathname)}`;
        }
    
        fetch("/session")
        .then(res => res.json())
        .then(data => {
            if (data.email) {
            emailSpan.textContent = data.email;
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline";
            } else {
            loginBtn.style.display = "inline";
            logoutBtn.style.display = "none";
            emailSpan.textContent = "";
            }
        });
    </script>
</body>
</html>
