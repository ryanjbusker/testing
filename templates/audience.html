<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audience Page - Live Translation</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 2rem;
    }
    .organization-name {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.5rem;
    }
    .top-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.5rem;
    }
    .translated-center {
      font-size: 2rem;
      text-align: center;
      min-height: 100px;
      margin-top: 4rem;
      max-width: 800px;
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="organization-name">{{.speakerName}}</div>
    <div class="top-controls">
      <select id="targetLanguage" class="form-control">
        <option value="en">English</option>
        <option value="ar">Arabic</option>
        <option value="ar">Arabic (Gulf)</option>
        <option value="ca">Catalan</option>
        <option value="zh">Chinese (Cantonese)</option>
        <option value="zh">Chinese (Mandarin)</option>
        <option value="cs">Czech</option>
        <option value="da">Danish</option>
        <option value="nl">Dutch</option>
        <option value="nl">Dutch (Belgian)</option>
        <option value="en">English (Australian)</option>
        <option value="en">English (British)</option>
        <option value="en">English (Indian)</option>
        <option value="en">English (New Zealand)</option>
        <option value="en">English (Welsh)</option>
        <option value="fi">Finnish</option>
        <option value="fr">French</option>
        <option value="fr">French (Belgian)</option>
        <option value="fr-CA">French (Canadian)</option>
        <option value="de">German</option>
        <option value="de">German (Austrian)</option>
        <option value="de">German (Swiss Standard)</option>
        <option value="hi">Hindi</option>
        <option value="is">Icelandic</option>
        <option value="it">Italian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="no">Norwegian</option>
        <option value="pl">Polish</option>
        <option value="pt">Portuguese (Brazilian)</option>
        <option value="pt-PT">Portuguese (European)</option>
        <option value="ro">Romanian</option>
        <option value="ru">Russian</option>
        <option value="es">Spanish (Spain)</option>
        <option value="es-MX">Spanish (Mexican)</option>
        <option value="es">Spanish (US)</option>
        <option value="sv">Swedish</option>
        <option value="tr">Turkish</option>
        <option value="cy">Welsh</option>
      </select>
      <select id="playbackSpeed" class="form-control">
        <option value="1.1">1.1x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="0.9">0.9x</option>
        <option value="1.0">1.0x</option>
        <option value="1.15">1.15x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2x</option>
      </select>
      <select id="voiceType" class="form-control">
        <option value="female">Female Voice</option>
        <option value="male">Male Voice</option>
        <option value="custom" style="display: none;">My Custom Voice</option>
      </select>
      <button id="connectToggleButton" class="button">Connect to Stream</button>
    </div>
  </div>

  <div id="translatedText" class="translated-center"></div>
<span id="speaker-code-data" data-code="{{.speakerCode}}" style="display:none"></span>

  <script>
    (function(){ var e = document.getElementById('speaker-code-data'); if (e) window.speakerCode = e.getAttribute('data-code'); })();
    let ws = null;
    const connectButton = document.getElementById('connectToggleButton');
    const translatedTextDiv = document.getElementById('translatedText');
    const targetLanguage = document.getElementById('targetLanguage');
    const voiceTypeSelect = document.getElementById('voiceType');
    let isConnected = false;
    let audioCtx = null;
    let audioQueue = [];
    let isPlaying = false;
    let currentAudio = null;
    let availableVoices = {};
    let userPlan = '';

    const subtitleQueue = [];

    // Load available voices based on speaker's subscription
    async function loadAvailableVoices() {
      try {
        const speakerCode = getSpeakerCodeFromUrl(); // Get speaker code from URL or template
        
        // Validate speaker code before making API call
        if (!speakerCode || speakerCode === 'audience' || speakerCode === '') {
          console.log('No valid speaker code found, skipping voice options load');
          return;
        }
        
        const url = `/api/available-voices?speaker_code=${encodeURIComponent(speakerCode)}`;
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          availableVoices = data.voices;
          userPlan = data.plan;
          
          console.log('Available voices for speaker:', data.voices);
          console.log('Speaker plan:', data.plan);
          console.log('Voice preference:', data.voice_preference);
          console.log('Has custom voice:', data.has_custom_voice);
          
          // Show voice selection if speaker has professional or premium subscription
          if (data.voices.male || data.voices.custom) {
            voiceTypeSelect.style.display = 'block';
            
            // Show/hide custom voice option based on availability
            const customOption = voiceTypeSelect.querySelector('option[value="custom"]');
            if (data.has_custom_voice && data.voices.custom) {
              customOption.style.display = 'block';
              console.log('Speaker has custom voice available');
            } else {
              customOption.style.display = 'none';
            }
            
            // Show/hide male voice option based on subscription
            const maleOption = voiceTypeSelect.querySelector('option[value="male"]');
            if (data.voices.male) {
              maleOption.style.display = 'block';
              console.log('Speaker has male/female voice options available');
            } else {
              maleOption.style.display = 'none';
            }
            
            console.log('Voice selection enabled for speaker plan:', data.plan);
          } else {
            console.log('Speaker has standard voice only');
          }
        } else {
          console.error('Failed to load voice options:', response.status, response.statusText);
        }
      } catch (error) {
        console.error('Error loading voice options:', error);
      }
    }

    // Check if speaker code is valid on page load and load voices
    (function() {
      const speakerCode = getSpeakerCodeFromUrl();
      if (!speakerCode || speakerCode === 'audience' || speakerCode === '') {
        translatedTextDiv.textContent = 'Please visit this page with a valid speaker code (e.g., /audience/12345)';
        connectButton.disabled = true;
        console.error('No valid speaker code found on page load');
      } else {
        // Load voices when page loads (only if we have a valid speaker code)
        loadAvailableVoices();
      }
    })();

    function showSubtitle(text) {
      const wordCount = text.trim().split(/\s+/).length;
      const duration = Math.min(Math.max(wordCount * 500, 2000), 9000);
      const expiresAt = Date.now() + duration;

      subtitleQueue.push({ text, expiresAt });
      updateSubtitleDisplay();

      setTimeout(() => {
        const now = Date.now();
        while (subtitleQueue.length && subtitleQueue[0].expiresAt <= now) {
          subtitleQueue.shift();
        }
        updateSubtitleDisplay();
      }, duration + 10);
    }

    function updateSubtitleDisplay() {
      translatedTextDiv.textContent = subtitleQueue.map(item => item.text).join(" ");
    }

    function getSpeakerCodeFromUrl() {
      // First try to get speaker code from template variable (if available)
      if (window.speakerCode && window.speakerCode !== 'audience' && window.speakerCode !== '') {
        return window.speakerCode;
      }
      // Fall back to parsing URL
      const pathParts = window.location.pathname.split('/').filter(part => part !== '');
      const lastPart = pathParts[pathParts.length - 1];
      // Don't return "audience" as speaker code - that means no code was provided
      if (lastPart === 'audience' || lastPart === '') {
        return null;
      }
      return lastPart;
    }

    function getVoiceId(label) {
        // Normalize label by extracting base language name (e.g., "Spanish (Spain)" -> "Spanish")
        const baseLabel = label.split('(')[0].trim();
        
        // Map language labels to valid AWS Polly voice IDs
        const voiceMap = {
            'English': 'Joanna',
            'Spanish': 'Lupe',  // Spanish female voice
            'French': 'Lea',
            'German': 'Vicki',
            'Italian': 'Bianca',
            'Portuguese': 'Camila',
            'Japanese': 'Mizuki',
            'Korean': 'Seoyeon',
            'Chinese': 'Zhiyu',
            'Russian': 'Tatyana',
            'Arabic': 'Zeina',
            'Hindi': 'Aditi',
            'Dutch': 'Lotte',
            'Swedish': 'Elin',
            'Danish': 'Naja',
            'Norwegian': 'Liv',
            'Finnish': 'Suvi',
            'Polish': 'Ewa',
            'Turkish': 'Filiz'
        };
        
        // Try exact match first, then try base label
        return voiceMap[label] || voiceMap[baseLabel] || 'Joanna'; // Default to Joanna if language not found
    }

    async function speakText(text, lang) {
      try {
        const speakerCode = getSpeakerCodeFromUrl(); // Get speaker code to determine voice tier
        
        // Validate speaker code before making TTS request
        if (!speakerCode || speakerCode === 'audience' || speakerCode === '') {
          console.error('Cannot synthesize speech: Invalid speaker code:', speakerCode);
          return;
        }
        
        const selectedOption = targetLanguage.options[targetLanguage.selectedIndex];
        const label = selectedOption.text;
        const speedSelect = document.getElementById('playbackSpeed');
        const playbackRate = speedSelect.value;
        const voiceType = voiceTypeSelect.value || 'female'; // Default to female if not selected
        
        const response = await fetch('/polly-tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            language: lang,
            voiceId: getVoiceId(label),
            speed: playbackRate,
            voiceType: voiceType,
            speakerCode: speakerCode // Send speaker code so backend can look up speaker's voice preference
          })
        });


        if (!response.ok) throw new Error('Failed to synthesize speech');

        const arrayBuffer = await response.arrayBuffer();
        const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
        // const speedSelect = document.getElementById('playbackSpeed');
        // const playbackRate = parseFloat(speedSelect.value);

        audioQueue.push({
          buffer: decodedData,
          playbackRate,
          resolve: () => {}
        });

        processAudioQueue();
      } catch (error) {
        console.error('Error queuing speech:', error);
      }
    }

    async function processAudioQueue() {
      if (isPlaying || audioQueue.length === 0) return;

      isPlaying = true;
    //   const { buffer, resolve } = audioQueue.shift();
      const { buffer, playbackRate, resolve } = audioQueue.shift();
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
    //   source.playbackRate.value = 1.25;
    //   source.playbackRate.value = playbackRate;
      source.connect(audioCtx.destination);

      source.onended = () => {
        isPlaying = false;
        resolve();
        processAudioQueue();
      };

      try {
        source.start(0);
      } catch (error) {
        console.error('Playback error:', error);
        isPlaying = false;
        resolve();
        processAudioQueue();
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      isPlaying = false;
      audioQueue = [];
    }

    function connectToStream() {
      const speakerCode = getSpeakerCodeFromUrl();
      
      // Validate speaker code before connecting
      if (!speakerCode || speakerCode === 'audience' || speakerCode === '') {
        alert('Error: No speaker code found. Please visit the audience page with a valid speaker code (e.g., /audience/12345)');
        console.error('Invalid speaker code:', speakerCode);
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        console.log("Audio context resumed");
      }).catch(err => {
        console.error("Failed to resume audio context:", err);
      });

      const lang = targetLanguage.value;
      const isSecure = window.location.protocol === 'https:';
      const wsProtocol = isSecure ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}/ws?role=audience&lang=${lang}&speaker_code=${encodeURIComponent(speakerCode)}`;

      console.log('Connecting to WebSocket with speaker code:', speakerCode);
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('WebSocket opened');
        connectButton.textContent = 'Disconnect';
        isConnected = true;
        targetLanguage.disabled = true;
      };

      ws.onclose = (event) => {
        console.log('WebSocket closed', event.code, event.reason);
        connectButton.textContent = 'Connect to Stream';
        isConnected = false;
        targetLanguage.disabled = false;
        stopAudio();
        
        // Show error message if connection was closed unexpectedly (not by user)
        if (event.code !== 1000 && event.code !== 1001) { // 1000 = normal closure, 1001 = going away
          if (event.code === 1006) { // Abnormal closure (likely 404 or stream not found)
            translatedTextDiv.textContent = 'Error: Could not connect to stream. Make sure the speaker has started streaming and you have the correct speaker code.';
          } else {
            translatedTextDiv.textContent = `Connection closed (code: ${event.code}). Please try again.`;
          }
        } else {
          translatedTextDiv.textContent = '';
        }
        subtitleQueue.length = 0;
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        translatedTextDiv.textContent = 'Error: Failed to connect to stream. Make sure the speaker is currently streaming.';
        connectButton.textContent = 'Connect to Stream';
        isConnected = false;
        targetLanguage.disabled = false;
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        
        // Handle error messages from server
        if (data.error) {
          console.error('Server error:', data.error);
          translatedTextDiv.textContent = `Error: ${data.error}`;
          if (data.error.includes('Stream not found') || data.error.includes('Speaker not found')) {
            translatedTextDiv.textContent = 'Error: No active stream found. Make sure the speaker has started streaming and you have the correct speaker code.';
          }
          ws.close();
          return;
        }

        if (data.type === 'translation') {
          showSubtitle(data.text);
          await speakText(data.text, targetLanguage.value);
        }
      };
    }

    function disconnectFromStream() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    connectButton.addEventListener('click', () => {
      if (!isConnected) {
        connectToStream();
      } else {
        disconnectFromStream();
      }
    });

    targetLanguage.addEventListener('change', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ language: targetLanguage.value }));
      }
    });

    window.onbeforeunload = () => {
      if (ws) {
        ws.close();
      }
      stopAudio();
    };
  </script>
</body>
</html>
