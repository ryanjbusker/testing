<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audience Page - Live Translation</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 2rem;
    }
    .organization-name {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.5rem;
    }
    .top-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.5rem;
    }
    .translated-center {
      font-size: 2rem;
      text-align: center;
      min-height: 100px;
      margin-top: 4rem;
      max-width: 800px;
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="organization-name">{{.speakerName}}</div>
    <div class="top-controls">
      <select id="targetLanguage" class="form-control">
        <option value="en">English</option>
        <option value="ar">Arabic</option>
        <option value="ar">Arabic (Gulf)</option>
        <option value="ca">Catalan</option>
        <option value="zh">Chinese (Cantonese)</option>
        <option value="zh">Chinese (Mandarin)</option>
        <option value="cs">Czech</option>
        <option value="da">Danish</option>
        <option value="nl">Dutch</option>
        <option value="nl">Dutch (Belgian)</option>
        <option value="en">English (Australian)</option>
        <option value="en">English (British)</option>
        <option value="en">English (Indian)</option>
        <option value="en">English (New Zealand)</option>
        <option value="en">English (Welsh)</option>
        <option value="fi">Finnish</option>
        <option value="fr">French</option>
        <option value="fr">French (Belgian)</option>
        <option value="fr-CA">French (Canadian)</option>
        <option value="de">German</option>
        <option value="de">German (Austrian)</option>
        <option value="de">German (Swiss Standard)</option>
        <option value="hi">Hindi</option>
        <option value="is">Icelandic</option>
        <option value="it">Italian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="no">Norwegian</option>
        <option value="pl">Polish</option>
        <option value="pt">Portuguese (Brazilian)</option>
        <option value="pt-PT">Portuguese (European)</option>
        <option value="ro">Romanian</option>
        <option value="ru">Russian</option>
        <option value="es">Spanish (Spain)</option>
        <option value="es-MX">Spanish (Mexican)</option>
        <option value="es">Spanish (US)</option>
        <option value="sv">Swedish</option>
        <option value="tr">Turkish</option>
        <option value="cy">Welsh</option>
      </select>
      <select id="playbackSpeed" class="form-control">
        <option value="1.1">1.1x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="0.9">0.9x</option>
        <option value="1.0">1.0x</option>
        <option value="1.15">1.15x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2x</option>
      </select>
      <select id="voiceType" class="form-control" style="display: none;">
        <option value="female">Female Voice (ElevenLabs)</option>
        <option value="male">Male Voice (ElevenLabs)</option>
        <option value="custom" style="display: none;">My Custom Voice (ElevenLabs)</option>
      </select>
      <button id="connectToggleButton" class="button">Connect to Stream</button>
    </div>
  </div>

  <div id="translatedText" class="translated-center"></div>

  <script>
    let ws = null;
    const connectButton = document.getElementById('connectToggleButton');
    const translatedTextDiv = document.getElementById('translatedText');
    const targetLanguage = document.getElementById('targetLanguage');
    const voiceTypeSelect = document.getElementById('voiceType');
    let isConnected = false;
    let audioCtx = null;
    let audioQueue = [];
    let isPlaying = false;
    let currentAudio = null;
    let availableVoices = {};
    let userPlan = '';

    const subtitleQueue = [];

    // Load available voices based on user's subscription
    async function loadAvailableVoices() {
      try {
        const response = await fetch('/api/available-voices');
        if (response.ok) {
          const data = await response.json();
          availableVoices = data.voices;
          userPlan = data.plan;
          
          // Show voice selection if user has professional or premium subscription
          if (data.voices.male || data.voices.custom) {
            voiceTypeSelect.style.display = 'block';
            
            // Show/hide custom voice option based on availability
            const customOption = voiceTypeSelect.querySelector('option[value="custom"]');
            if (data.has_custom_voice && data.voices.custom) {
              customOption.style.display = 'block';
              console.log('Premium user: Custom voice available');
            } else {
              customOption.style.display = 'none';
            }
            
            // Show/hide male voice option based on subscription
            const maleOption = voiceTypeSelect.querySelector('option[value="male"]');
            if (data.voices.male) {
              maleOption.style.display = 'block';
              console.log('Professional/Premium user: Male voice available');
            } else {
              maleOption.style.display = 'none';
            }
            
            console.log('Voice selection enabled for plan:', data.plan);
          } else {
            console.log('Starter user: Only female voice available');
          }
        }
      } catch (error) {
        console.log('Could not load voice options:', error);
      }
    }

    // Load voices when page loads
    loadAvailableVoices();

    function showSubtitle(text) {
      const wordCount = text.trim().split(/\s+/).length;
      const duration = Math.min(Math.max(wordCount * 500, 2000), 9000);
      const expiresAt = Date.now() + duration;

      subtitleQueue.push({ text, expiresAt });
      updateSubtitleDisplay();

      setTimeout(() => {
        const now = Date.now();
        while (subtitleQueue.length && subtitleQueue[0].expiresAt <= now) {
          subtitleQueue.shift();
        }
        updateSubtitleDisplay();
      }, duration + 10);
    }

    function updateSubtitleDisplay() {
      translatedTextDiv.textContent = subtitleQueue.map(item => item.text).join(" ");
    }

    function getSpeakerCodeFromUrl() {
      const pathParts = window.location.pathname.split('/');
      return pathParts[pathParts.length - 1];
    }

    function getVoiceId(label) {
        // Map language labels to valid AWS Polly voice IDs
        const voiceMap = {
            'English': 'Joanna',
            'Spanish': 'Lupe',
            'French': 'Lea',
            'German': 'Vicki',
            'Italian': 'Bianca',
            'Portuguese': 'Camila',
            'Japanese': 'Mizuki',
            'Korean': 'Seoyeon',
            'Chinese': 'Zhiyu',
            'Russian': 'Tatyana',
            'Arabic': 'Zeina',
            'Hindi': 'Aditi',
            'Dutch': 'Lotte',
            'Swedish': 'Elin',
            'Danish': 'Naja',
            'Norwegian': 'Liv',
            'Finnish': 'Suvi',
            'Polish': 'Ewa',
            'Turkish': 'Filiz'
        };
        
        return voiceMap[label] || 'Joanna'; // Default to Joanna if language not found
    }

    async function speakText(text, lang) {
      try {
        const selectedOption = targetLanguage.options[targetLanguage.selectedIndex];
        const label = selectedOption.text;
        const speedSelect = document.getElementById('playbackSpeed');
        const playbackRate = speedSelect.value;
        const voiceType = voiceTypeSelect.value || 'female'; // Default to female if not selected
        
        const response = await fetch('/polly-tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            language: lang,
            voiceId: getVoiceId(label),
            speed: playbackRate,
            voiceType: voiceType
          })
        });


        if (!response.ok) throw new Error('Failed to synthesize speech');

        const arrayBuffer = await response.arrayBuffer();
        const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
        // const speedSelect = document.getElementById('playbackSpeed');
        // const playbackRate = parseFloat(speedSelect.value);

        audioQueue.push({
          buffer: decodedData,
          playbackRate,
          resolve: () => {}
        });

        processAudioQueue();
      } catch (error) {
        console.error('Error queuing speech:', error);
      }
    }

    async function processAudioQueue() {
      if (isPlaying || audioQueue.length === 0) return;

      isPlaying = true;
    //   const { buffer, resolve } = audioQueue.shift();
      const { buffer, playbackRate, resolve } = audioQueue.shift();
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
    //   source.playbackRate.value = 1.25;
    //   source.playbackRate.value = playbackRate;
      source.connect(audioCtx.destination);

      source.onended = () => {
        isPlaying = false;
        resolve();
        processAudioQueue();
      };

      try {
        source.start(0);
      } catch (error) {
        console.error('Playback error:', error);
        isPlaying = false;
        resolve();
        processAudioQueue();
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      isPlaying = false;
      audioQueue = [];
    }

    function connectToStream() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        console.log("Audio context resumed");
      }).catch(err => {
        console.error("Failed to resume audio context:", err);
      });

      const speakerCode = getSpeakerCodeFromUrl();
      const lang = targetLanguage.value;
      const isSecure = window.location.protocol === 'https:';
      const wsProtocol = isSecure ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}/ws?role=audience&lang=${lang}&speaker_code=${encodeURIComponent(speakerCode)}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('WebSocket opened');
        connectButton.textContent = 'Disconnect';
        isConnected = true;
        targetLanguage.disabled = true;
      };

      ws.onclose = () => {
        console.log('WebSocket closed');
        connectButton.textContent = 'Connect to Stream';
        isConnected = false;
        targetLanguage.disabled = false;
        stopAudio();
        translatedTextDiv.textContent = '';
        subtitleQueue.length = 0;
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'translation') {
          showSubtitle(data.text);
          await speakText(data.text, targetLanguage.value);
        }
      };
    }

    function disconnectFromStream() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    connectButton.addEventListener('click', () => {
      if (!isConnected) {
        connectToStream();
      } else {
        disconnectFromStream();
      }
    });

    targetLanguage.addEventListener('change', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ language: targetLanguage.value }));
      }
    });

    window.onbeforeunload = () => {
      if (ws) {
        ws.close();
      }
      stopAudio();
    };
  </script>
</body>
</html>
