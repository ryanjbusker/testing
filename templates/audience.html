<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Page - Live Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">BMM Translation</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/speaker">Speaker</a>
                <a href="/audience">Audience</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Audience Page</h1>
        
        <div class="content-box">
            <div class="form-group">
                <label for="targetLanguage">Select Your Language</label>
                <select id="targetLanguage" class="form-control">
                    <option value="en-US">English (US)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                </select>
            </div>

            <div class="form-group">
                <label for="streamPassword">Stream Password</label>
                <input type="text" id="streamPassword" class="form-control" maxlength="5" placeholder="Enter 5-digit password" pattern="[0-9]{5}" required>
                <small class="form-text">Enter the 5-digit password provided by the speaker</small>
            </div>

            <div class="button-group">
                <button id="connectButton" class="button">Connect to Stream</button>
                <button id="disconnectButton" class="button button-danger" disabled>Disconnect</button>
            </div>

            <div class="form-group">
                <label>Status</label>
                <div id="status" class="status-text">Not connected</div>
            </div>

            <div class="form-group">
                <label>Active Speakers</label>
                <div id="activeSpeakers" class="status-text">No active speakers</div>
            </div>

            <div class="form-group">
                <label>Translated Text</label>
                <div id="translatedText" class="text-box"></div>
            </div>

            <div class="form-group">
                <label>Audio Controls</label>
                <div class="button-group">
                    <button id="playButton" class="button" disabled>Play</button>
                    <button id="pauseButton" class="button button-warning" disabled>Pause</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        let speechSynthesis = window.speechSynthesis;
        let currentUtterance = null;
        let lastSpokenText = '';
        let speechQueue = [];
        let isSpeaking = false;
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');
        const statusDiv = document.getElementById('status');
        const activeSpeakersDiv = document.getElementById('activeSpeakers');
        const translatedTextDiv = document.getElementById('translatedText');
        const targetLanguage = document.getElementById('targetLanguage');
        const streamPassword = document.getElementById('streamPassword');
        const playButton = document.getElementById('playButton');
        const pauseButton = document.getElementById('pauseButton');
        const stopButton = document.getElementById('stopButton');
        let activeSpeakers = new Set();

        function updateActiveSpeakers() {
            if (activeSpeakers.size === 0) {
                activeSpeakersDiv.textContent = 'No active speakers';
            } else {
                activeSpeakersDiv.textContent = `Active Speakers: ${Array.from(activeSpeakers).join(', ')}`;
            }
        }

        function speak(text) {
            // Only speak if the text is different from the last spoken text
            if (text === lastSpokenText) {
                return;
            }

            // Add new text to the queue
            speechQueue.push(text);
            
            // If not currently speaking, start speaking
            if (!isSpeaking) {
                speakNextInQueue();
            }
        }

        function speakNextInQueue() {
            if (speechQueue.length === 0) {
                isSpeaking = false;
                return;
            }

            isSpeaking = true;
            const text = speechQueue.shift();
            
            // Cancel any ongoing speech
            if (currentUtterance) {
                speechSynthesis.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLanguage.value;
            
            // Adjust speech parameters for slightly slower but still natural speech
            utterance.rate = 1.1;  // Reduced from 1.2 to 1.1 for slightly slower speech
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Get available voices and select one for the target language
            const voices = speechSynthesis.getVoices();
            let selectedVoice = null;
            
            // Try to find a voice that matches the exact language code first
            selectedVoice = voices.find(voice => voice.lang === targetLanguage.value);
            
            // If not found, try to match the language code without the region
            if (!selectedVoice) {
                const baseLang = targetLanguage.value.split('-')[0];
                selectedVoice = voices.find(voice => voice.lang.startsWith(baseLang));
            }
            
            // If still not found, use the first available voice
            if (!selectedVoice && voices.length > 0) {
                selectedVoice = voices[0];
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            currentUtterance = utterance;
            lastSpokenText = text;

            // Keep the quick transitions between phrases
            utterance.onend = () => {
                setTimeout(() => {
                    speakNextInQueue();
                }, 20); // Keep the quick 20ms delay for smooth transitions
            };

            speechSynthesis.speak(utterance);
        }

        // Initialize voices when they become available
        function initializeVoices() {
            const voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                // Voices are already loaded
                console.log('Voices loaded:', voices.map(v => `${v.name} (${v.lang})`));
            }
        }

        // Handle voice loading
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initializeVoices;
        }

        // Initial voice check
        initializeVoices();

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const protocol = isLocalhost ? 'ws:' : 'wss:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=audience&lang=${targetLanguage.value}&password=${streamPassword.value}`;
            console.log('Connecting to WebSocket:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                statusDiv.textContent = 'Connected';
                connectButton.disabled = true;
                streamPassword.disabled = true;
                targetLanguage.disabled = true;
            };

            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected';
                connectButton.disabled = false;
                streamPassword.disabled = false;
                targetLanguage.disabled = false;
                activeSpeakers.clear();
                updateActiveSpeakers();
            };

            ws.onerror = (error) => {
                statusDiv.textContent = 'Error: ' + error.message;
                connectButton.disabled = false;
                streamPassword.disabled = false;
                targetLanguage.disabled = false;
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'translation') {
                    translatedTextDiv.textContent = data.text;
                    if (data.speaker) {
                        activeSpeakers.add(data.speaker);
                        updateActiveSpeakers();
                    }
                } else if (data.type === 'speaker_left') {
                    activeSpeakers.delete(data.speaker);
                    updateActiveSpeakers();
                } else if (data.type === 'password_updated') {
                    streamPassword.value = data.password;
                }
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            speechQueue = [];
            lastSpokenText = '';
            isSpeaking = false;
        }

        connectButton.addEventListener('click', () => {
            if (streamPassword.value.length === 5) {
                connectWebSocket();
            } else {
                statusDiv.textContent = 'Please enter a valid 5-digit password';
            }
        });
        disconnectButton.addEventListener('click', disconnectWebSocket);
        targetLanguage.addEventListener('change', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    language: targetLanguage.value
                }));
            }
            // Clear speech queue and reset state when changing language
            speechQueue = [];
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            lastSpokenText = '';
            isSpeaking = false;
        });

        playButton.addEventListener('click', () => {
            if (!isSpeaking) {
                if (currentUtterance) {
                    speechSynthesis.resume();
                }
                playButton.disabled = true;
                pauseButton.disabled = false;
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isSpeaking) {
                speechSynthesis.pause();
                playButton.disabled = false;
                pauseButton.disabled = true;
            }
        });
    </script>
</body>
</html>
