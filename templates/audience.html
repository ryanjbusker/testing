<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Page - Live Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="container">
        <h1>Audience Page</h1>
        
        <div class="content-box">
            <div class="form-group">
                <label for="targetLanguage">Select Your Language</label>
                <!-- <select id="targetLanguage" class="form-control">
                    <option value="en-US">English (US)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                </select> -->
                <select id="targetLanguage" class="form-control">
                    <option value="en">English</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese (Simplified)</option>
                    <option value="da">Danish</option>
                    <option value="nl">Dutch</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="hi">Hindi</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="pl">Polish</option>
                    <option value="pt">Portuguese</option>
                    <option value="ro">Romanian</option>
                    <option value="ru">Russian</option>
                    <option value="es">Spanish</option>
                    <option value="sv">Swedish</option>
                    <option value="tr">Turkish</option>
                </select>
                
            </div>

            <div class="button-group">
                <button id="connectButton" class="button">Connect to Stream</button>
                <button id="disconnectButton" class="button button-danger" disabled>Disconnect</button>
            </div>

            <div class="form-group">
                <label>Status</label>
                <div id="status" class="status-text">Not connected</div>
            </div>

            <div class="form-group">
                <label>Active Speakers</label>
                <div id="activeSpeakers" class="status-text">No active speakers</div>
            </div>

            <div class="form-group">
                <label>Translated Text</label>
                <div id="translatedText" class="text-box"></div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');
        const statusDiv = document.getElementById('status');
        const activeSpeakersDiv = document.getElementById('activeSpeakers');
        const translatedTextDiv = document.getElementById('translatedText');
        const targetLanguage = document.getElementById('targetLanguage');
        let activeSpeakers = new Set();
        let audioQueue = [];
        let isPlaying = false;
        let currentAudio = null;

        function updateActiveSpeakers() {
            if (activeSpeakers.size === 0) {
                activeSpeakersDiv.textContent = 'No active speakers';
            } else {
                activeSpeakersDiv.textContent = `Active Speakers: ${Array.from(activeSpeakers).join(', ')}`;
            }
        }
        function getVoiceId(lang) {
            const voices = {
                'es': 'Lupe',
                'fr': 'Celine',
                'de': 'Marlene',
                'it': 'Carla',
                'ja': 'Mizuki',
                'ko': 'Seoyeon',
                'ru': 'Tatyana',
                'hi': 'Aditi',
                'en': 'Joanna',
                // Add more as needed
            };
            return voices[lang] || 'Joanna'; // Fallback to English
        }

        // Function to process the audio queue
        async function processAudioQueue() {
            if (isPlaying || audioQueue.length === 0) return;
            
            isPlaying = true;
            const { audio, resolve } = audioQueue.shift();
            currentAudio = audio;
            
            try {
                await audio.play();
                audio.onended = () => {
                    isPlaying = false;
                    currentAudio = null;
                    resolve();
                    processAudioQueue(); // Process next item in queue
                };
            } catch (error) {
                console.error('Error playing audio:', error);
                isPlaying = false;
                currentAudio = null;
                resolve();
                processAudioQueue(); // Continue with next item even if there's an error
            }
        }

        // Function to stop current audio and clear queue
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            isPlaying = false;
            audioQueue = [];
        }

        async function speakText(text, lang) {
            try {
                console.log('Calling Polly TTS with text:', text, 'language:', lang);
                const response = await fetch('/polly-tts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        language: lang,
                        voiceId: getVoiceId(lang)
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to synthesize speech');
                }

                // Create a blob from the audio data
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Create audio element
                const audio = new Audio(audioUrl);
                audio.onended = () => {
                    URL.revokeObjectURL(audioUrl); // Clean up the URL object
                };

                // Add to queue and process
                audioQueue.push({
                    audio,
                    resolve: () => {} // Empty resolve function
                });
                processAudioQueue();
            } catch (error) {
                console.error('Error playing speech:', error);
            }
        }

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const protocol = isLocalhost ? 'ws:' : 'wss:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=audience&lang=${targetLanguage.value}`;
            console.log('Connecting to WebSocket:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDiv.textContent = 'Connected';
                connectButton.disabled = true;
                disconnectButton.disabled = false;
                targetLanguage.disabled = true;
            };

            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected';
                connectButton.disabled = false;
                disconnectButton.disabled = true;
                targetLanguage.disabled = false;
                activeSpeakers.clear();
                updateActiveSpeakers();
                stopAudio(); // Stop any playing audio when disconnected
            };

            ws.onerror = (error) => {
                statusDiv.textContent = 'Error: ' + error.message;
                connectButton.disabled = false;
                disconnectButton.disabled = true;
                targetLanguage.disabled = false;
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'translation') {
                    translatedTextDiv.textContent = data.text;
                    if (data.speaker) {
                        activeSpeakers.add(data.speaker);
                        updateActiveSpeakers();
                    }
                    await speakText(data.text, targetLanguage.value);
                } else if (data.type === 'speaker_left') {
                    activeSpeakers.delete(data.speaker);
                    updateActiveSpeakers();
                }
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
            
            // Reset UI elements
            statusDiv.textContent = 'Not connected';
            connectButton.disabled = false;
            disconnectButton.disabled = true;
            targetLanguage.disabled = false;
            translatedTextDiv.textContent = '';
            activeSpeakers.clear();
            updateActiveSpeakers();
            stopAudio(); // Stop any playing audio when disconnecting
        }

        connectButton.addEventListener('click', connectWebSocket);
        disconnectButton.addEventListener('click', disconnectWebSocket);
        targetLanguage.addEventListener('change', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    language: targetLanguage.value
                }));
            }
        });

        // Clean up on page unload
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
        };

        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const emailSpan = document.getElementById("user-email");
    
        // Redirect back to this page after login
        if (loginBtn) {
            loginBtn.href = `/login?from=${encodeURIComponent(window.location.pathname)}`;
        }
    
        window.addEventListener("DOMContentLoaded", () => {
            const emailSpan = document.getElementById("email");
            const loginBtn = document.getElementById("login-btn");
            const logoutBtn = document.getElementById("logout-btn");

            fetch("/session")
                .then(res => res.json())
                .then(data => {
                    if (emailSpan && loginBtn && logoutBtn) {
                        if (data.email) {
                            emailSpan.textContent = data.email;
                            loginBtn.style.display = "none";
                            logoutBtn.style.display = "inline";
                        } else {
                            emailSpan.textContent = "";
                            loginBtn.style.display = "inline";
                            logoutBtn.style.display = "none";
                        }
                    }
                });
        });
    </script>    
</body>
</html>
