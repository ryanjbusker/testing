<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Page - Live Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Audience Page</h1>
    
        <div class="content-box">
            <div class="form-group">
                <label for="targetLanguage">Select Your Language</label>
                <select id="targetLanguage" class="form-control">
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (British)</option>
                    <option value="en-AU">English (Australian)</option>
                    <option value="en-IN">English (Indian)</option>
                    <option value="es-ES">Spanish (European)</option>
                    <option value="es-MX">Spanish (Mexican)</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="pt-BR">Portuguese (Brazilian)</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="ko-KR">Korean</option>
                    <option value="zh-CN">Chinese (Mandarin)</option>
                </select>
            </div>

            <div class="button-group">
                <button id="connectButton" class="button">Connect to Stream</button>
                <button id="disconnectButton" class="button button-danger" disabled>Disconnect</button>
            </div>

            <div class="form-group">
                <label>Status</label>
                <div id="status" class="status-text">Not connected</div>
            </div>

            <div class="form-group">
                <label>Connected Speaker</label>
                <div id="activeSpeakers" class="status-text">Not connected to any speaker</div>
            </div>

            <div class="form-group">
                <label>Translated Text</label>
                <div id="translatedText" class="text-box"></div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');
        const statusDiv = document.getElementById('status');
        const activeSpeakersDiv = document.getElementById('activeSpeakers');
        const translatedTextDiv = document.getElementById('translatedText');
        const targetLanguage = document.getElementById('targetLanguage');
        let activeSpeakers = new Set();
        let audioQueue = [];
        let isPlaying = false;
        let currentAudio = null;

        // Get speaker code from URL path
        function getSpeakerCodeFromUrl() {
            const pathParts = window.location.pathname.split('/');
            return pathParts[pathParts.length - 1];
        }

        let subtitleTimer = null;
        const subtitleQueue = [];
        function updateSubtitleDisplay() {
            translatedTextDiv.textContent = subtitleQueue.map(item => item.text).join(" ");
        }
        function showSubtitle(text) {
            const wordCount = text.trim().split(/\s+/).length;
            const duration = Math.min(Math.max(wordCount * 500, 2000), 9000);
            const expiresAt = Date.now() + duration;

            // Add new text block
            subtitleQueue.push({ text, expiresAt });
            updateSubtitleDisplay();

            // Schedule cleanup
            setTimeout(() => {
                // Remove expired items
                const now = Date.now();
                while (subtitleQueue.length && subtitleQueue[0].expiresAt <= now) {
                    subtitleQueue.shift();
                }
                updateSubtitleDisplay();
            }, duration + 10); // small buffer to ensure cleanup
        }

        function updateActiveSpeakers() {
            if (activeSpeakers.size === 0) {
                activeSpeakersDiv.textContent = 'No active speakers';
            } else {
                activeSpeakersDiv.textContent = `Active Speakers: ${Array.from(activeSpeakers).join(', ')}`;
            }
        }

        function getVoiceId(lang) {
            const voices = {
                'en-US': 'Matthew',
                'en-GB': 'Brian',
                'en-AU': 'Olivia',
                'en-IN': 'Kajal',
                'es-ES': 'Sergio',
                'es-MX': 'Mia',
                'fr-FR': 'Celine',
                'de-DE': 'Vicki',
                'it-IT': 'Carla',
                'pt-BR': 'Camila',
                'ja-JP': 'Takumi',
                'ko-KR': 'Seoyeon',
                'zh-CN': 'Zhiyu'
            };
            return voices[lang] || 'Matthew'; // Fallback to English (US)
        }

        // Function to process the audio queue
        async function processAudioQueue() {
            if (isPlaying || audioQueue.length === 0) return;
            
            isPlaying = true;
            const { audio, resolve } = audioQueue.shift();
            currentAudio = audio;
            
            try {
                await audio.play();
                audio.onended = () => {
                    isPlaying = false;
                    currentAudio = null;
                    resolve();
                    processAudioQueue(); // Process next item in queue
                };
            } catch (error) {
                console.error('Error playing audio:', error);
                isPlaying = false;
                currentAudio = null;
                resolve();
                processAudioQueue(); // Continue with next item even if there's an error
            }
        }

        // Function to stop current audio and clear queue
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            isPlaying = false;
            audioQueue = [];
        }

        async function speakText(text, lang) {
            try {
                console.log('Calling Polly TTS with text:', text, 'language:', lang);
                const response = await fetch('/polly-tts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        language: lang,
                        voiceId: getVoiceId(lang)
                    })
                });

                if (!response.ok) {
                    console.error('Polly TTS request failed:', response.status, response.statusText);
                    throw new Error('Failed to synthesize speech');
                }

                console.log('Received audio response from Polly TTS');
                // Create a blob from the audio data
                const audioBlob = await response.blob();
                console.log('Created audio blob:', audioBlob.size, 'bytes');
                const audioUrl = URL.createObjectURL(audioBlob);

                // Create audio element
                const audio = new Audio(audioUrl);
                audio.onended = () => {
                    console.log('Audio playback completed');
                    URL.revokeObjectURL(audioUrl); // Clean up the URL object
                };
                audio.playbackRate = 1.25;
                // Add to queue and process
                audioQueue.push({
                    audio,
                    resolve: () => {} // Empty resolve function
                });
                console.log('Added audio to queue, current queue length:', audioQueue.length);
                processAudioQueue();
            } catch (error) {
                console.error('Error in speakText:', error);
            }
        }

        function connectWebSocket() {
            if (ws) {
                console.log('Closing existing WebSocket connection...');
                ws.close();
            }

            const speakerCode = getSpeakerCodeFromUrl();
            console.log('Extracted speaker code from URL:', speakerCode);
            
            const lang = targetLanguage.value;
            console.log('Selected target language:', lang);
            
            // Determine if we're in production based on the protocol
            const isSecure = window.location.protocol === 'https:';
            const wsProtocol = isSecure ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?role=audience&lang=${lang}&speaker_code=${encodeURIComponent(speakerCode)}`;

            console.log('Connecting to WebSocket:', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connection opened successfully');
                statusDiv.textContent = 'Connected';
                connectButton.disabled = true;
                disconnectButton.disabled = false;
                targetLanguage.disabled = true;
            };

            ws.onclose = (event) => {
                console.log('WebSocket closed:', event.code, event.reason);
                statusDiv.textContent = 'Disconnected';
                connectButton.disabled = false;
                disconnectButton.disabled = true;
                targetLanguage.disabled = false;
                activeSpeakers.clear();
                updateActiveSpeakers();
                stopAudio(); // Stop any playing audio when disconnected
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusDiv.textContent = 'Error: Connection failed';
                connectButton.disabled = false;
                disconnectButton.disabled = true;
                targetLanguage.disabled = false;
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                console.log('Received WebSocket message:', data);

                if (data.type === 'connected') {
                    console.log('Connected to stream:', data.streamName);
                    console.log('Stream description:', data.streamDesc);
                    // Extract speaker name from stream name (removes "'s Stream" suffix)
                    const speakerName = data.streamName.replace("'s Stream", "");
                    activeSpeakersDiv.textContent = `Connected to: ${speakerName}`;
                } else if (data.type === 'active_speakers') {
                    console.log('Received active speakers list:', data.speakers);
                    if (data.speakers.length > 0) {
                        activeSpeakersDiv.textContent = `Connected to: ${data.speakers[0]}`;
                    } else {
                        activeSpeakersDiv.textContent = 'Not connected to any speaker';
                    }
                } else if (data.type === 'translation') {
                    console.log('Received translation:', data.text);
                    console.log('Original text:', data.original);
                    showSubtitle(data.text);
                    await speakText(data.text, targetLanguage.value);
                } else {
                    console.log('Received unknown message type:', data.type);
                }
            };
        }

        connectButton.addEventListener('click', connectWebSocket);
        disconnectButton.addEventListener('click', () => {
            if (ws) {
                ws.close();
            }
        });

        // Clean up on page unload
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
            stopAudio();
        };
    </script>
</body>
</html>
