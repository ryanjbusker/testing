<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Page - Live Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">BMM Translation</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/speaker">Speaker</a>
                <a href="/audience">Audience</a>
                <a href="/streams">Active Streams</a>
                <a href="/contact">Contact</a>
                <a href="/account">Account</a>
            </div>
            <span id="user-email" class="user-email"></span>
            <a id="login-btn" href="/login" class="auth-button">Sign In</a>
            <a id="logout-btn" href="/logout" class="auth-button" style="display: none;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Speaker Page</h1>
        
        <div class="content-box">
            <div class="form-group">
                <label for="sourceLanguage">Your Language</label>
                <select id="sourceLanguage" class="form-control">
                    <option value="en">English</option>
                    <option value="bg">Bulgarian</option>
                    <option value="ca">Catalan</option>
                    <option value="zh">Chinese (Mandarin, Simplified)</option>
                    <option value="zh-TW">Chinese (Mandarin, Traditional)</option>
                    <!-- <option value="zh-HK">Chinese (Cantonese, Traditional)</option> -->
                    <option value="cs">Czech</option>
                    <option value="da">Danish</option>
                    <option value="nl">Dutch</option>
                    <option value="et">Estonian</option>
                    <option value="fi">Finnish</option>
                    <!-- <option value="nl-BE">Flemish</option> -->
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <!-- <option value="de-CH">German (Switzerland)</option> -->
                    <option value="el">Greek</option>
                    <option value="hi">Hindi</option>
                    <option value="hu">Hungarian</option>
                    <option value="id">Indonesian</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="lv">Latvian</option>
                    <option value="lt">Lithuanian</option>
                    <option value="ms">Malay</option>
                    <option value="no">Norwegian</option>
                    <option value="pl">Polish</option>
                    <option value="pt">Portuguese</option>
                    <option value="ro">Romanian</option>
                    <option value="ru">Russian</option>
                    <option value="sk">Slovak</option>
                    <option value="es">Spanish</option>
                    <option value="sv">Swedish</option>
                    <option value="th">Thai</option>
                    <option value="tr">Turkish</option>
                    <option value="uk">Ukrainian</option>
                    <option value="vi">Vietnamese</option>
                </select>
            </div>

            <div class="button-group">
                <button id="startButton" class="button" disabled>Start Speaking</button>
                <button id="stopButton" class="button button-danger" disabled>Stop Speaking</button>
            </div>

            <div class="form-group">
                <label>Status</label>
                <div id="status" class="status-text">Not connected</div>
            </div>

            <div class="form-group">
                <label>Recognized Text</label>
                <div id="recognizedText" class="text-box">
                    Your speech will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Audio recording and streaming variables
        let ws = null;
        let audioContext = null;
        let microphone = null;
        let processor = null;
        let isRecording = false;
        let mediaStream = null;
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusDiv = document.getElementById('status');
        const recognizedTextDiv = document.getElementById('recognizedText');
        const sourceLanguage = document.getElementById('sourceLanguage');
    
        // Constants for audio processing
        const SAMPLE_RATE = 16000; // 16kHz sample rate for best compatibility with Deepgram
        const BUFFER_SIZE = 4096;  // Buffer size for audio processing

        // Function to get speaker code from server
        async function getSpeakerCode() {
            try {
                console.log('Fetching speaker code...');
                const response = await fetch('/get-speaker-code');
                console.log('Speaker code response:', response);
                const data = await response.json();
                console.log('Speaker code data:', data);
                if (data.error) {
                    throw new Error(data.error);
                }
                return data.speaker_code;
            } catch (error) {
                console.error('Error getting speaker code:', error);
                statusDiv.textContent = 'Error: ' + error.message;
                return null;
            }
        }

        async function connectWebSocket() {
            if (ws) {
                console.log('Closing existing WebSocket connection...');
                ws.close();
            }

            console.log('Getting speaker code...');
            const speakerCode = await getSpeakerCode();
            if (!speakerCode) {
                console.error('Failed to get speaker code');
                return;
            }
            console.log('Got speaker code:', speakerCode);

            const lang = sourceLanguage.value;
            console.log('Selected language:', lang);
            
            // Determine if we're in production based on the protocol
            const isSecure = window.location.protocol === 'https:';
            const wsProtocol = isSecure ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?role=speaker&lang=${lang}&speaker_code=${encodeURIComponent(speakerCode)}`;

            console.log('Connecting to WebSocket:', wsUrl);

            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                console.log('WebSocket connection opened');
                statusDiv.textContent = 'Connected';

                // Enable speaking
                startButton.disabled = false;

                // Auto-start recording if previously recording
                if (isRecording) {
                    console.log("Restarting audio stream for new speaker...");
                    startRecording();
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received message:', data);

                if (data.error) {
                    console.error('Server error:', data.error);
                    statusDiv.textContent = 'Error: ' + data.error;
                    resetUI();
                    return;
                }

                if (data.type === 'transcription') {
                    recognizedTextDiv.textContent = data.text;
                    if (data.final) {
                        statusDiv.textContent = 'Speech completed. Ready for more.';
                    }
                } else if (data.type === 'interim') {
                    recognizedTextDiv.textContent = data.text + "...";
                }
            };

            ws.onclose = (event) => {
                console.log('WebSocket closed:', event.code, event.reason);
                statusDiv.textContent = 'Disconnected';
                resetUI();
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusDiv.textContent = 'Error: Connection failed';
                resetUI();
            };
        }

        // Connect WebSocket when language changes
        sourceLanguage.addEventListener("change", () => {
            if (isRecording) {
                stopRecording();  // stops + closes audio context
                setTimeout(() => {
                    connectWebSocket(); // re-connect after audio context cleaned up
                }, 500);
            } else {
                connectWebSocket();
            }
        });

        connectWebSocket();

        function resetUI() {
            stopRecording();
            startButton.disabled = false;  // Allow user to start again
            stopButton.disabled = true;
            recognizedTextDiv.textContent = 'Your speech will appear here...';
            statusDiv.textContent = 'Not connected';
        }
        
        // Start recording and streaming audio
        async function startRecording() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                statusDiv.textContent = 'WebSocket not ready';
                return;
            }
            try {
                if (!audioContext) {
                    // Initialize AudioContext
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: SAMPLE_RATE
                    });

                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });
                    microphone = audioContext.createMediaStreamSource(mediaStream);

                    // Create script processor node for audio processing
                    processor = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);
                    
                    // Process audio data
                    processor.onaudioprocess = (e) => {
                        if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) {
                            return;
                        }
                        
                        // Get audio data from input buffer
                        const inputData = e.inputBuffer.getChannelData(0);
                        
                        // Convert float32 array to Int16 array (required format for Deepgram)
                        const int16Data = convertFloat32ToInt16(inputData);
                        
                        // Send binary audio data to server
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(int16Data.buffer);
                        }
                    };
                    
                    // Connect nodes
                    microphone.connect(processor);
                    processor.connect(audioContext.destination);

                }
                
                isRecording = true;
                startButton.disabled = true;
                stopButton.disabled = false;
                statusDiv.textContent = 'Speaking...';

                sourceLanguage.disabled = true;
                
            } catch (error) {
                console.error('Error starting recording:', error);
                statusDiv.textContent = 'Error: Failed to access microphone';
            }
        }

        // Stop recording and streaming audio
        function stopRecording() {
            if (isRecording) {
                isRecording = false;
                
                // Send disconnect message to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'disconnect'
                    }));
                }
                
                // Disconnect microphone and processor
                if (microphone && processor) {
                    microphone.disconnect(processor);
                    processor.disconnect(audioContext.destination);
                }
                
                // Reset UI
                startButton.disabled = false;
                stopButton.disabled = true;
                statusDiv.textContent = 'Stopped';
                sourceLanguage.disabled = false;

                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }

                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close().then(() => {
                        audioContext = null;
                        microphone = null;
                        processor = null;
                    });
                }
            }
        }

        // Helper function to convert Float32Array to Int16Array for proper audio encoding
        function convertFloat32ToInt16(float32Array) {
            const int16Array = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                // Convert float32 (-1.0 to 1.0) to int16 (-32768 to 32767)
                const s = Math.max(-1, Math.min(1, float32Array[i]));
                int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return int16Array;
        }

        startButton.addEventListener('click', startRecording);
        stopButton.addEventListener('click', stopRecording);
        sourceLanguage.addEventListener('change', () => {
            // Reset and reconnect WebSocket when language changes
            if (isRecording) {
                stopRecording();
            }
            connectWebSocket();
        });


        // Clean up on page unload
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
            if (isRecording) {
                stopRecording();
            }
        };
        
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const emailSpan = document.getElementById("user-email");

        // Redirect back to this page after login
        if (loginBtn) {
            loginBtn.href = `/login?from=${encodeURIComponent(window.location.pathname)}`;
        }

        fetch("/session")
            .then(res => res.json())
            .then(data => {
                if (data.email) {
                    emailSpan.textContent = data.email;
                    loginBtn.style.display = "none";
                    logoutBtn.style.display = "inline";
                } else {
                    emailSpan.textContent = "";
                    loginBtn.style.display = "inline";
                    logoutBtn.style.display = "none";
                }
            });
    </script>
</body>
</html>
