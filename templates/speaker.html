<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Page - Live Translation</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Additional styles for audio visualization */
        #audioVisualizer {
            width: 100%;
            height: 60px;
            background-color: #f5f5f5;
            margin: 10px 0;
            border-radius: 4px;
        }
        
        .status-recording {
            color: #dc3545;
            font-weight: bold;
        }
        
        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #dc3545;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        
        .audio-controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .mic-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .mic-button:hover {
            background-color: #0069d9;
            transform: scale(1.05);
        }
        
        .mic-button.recording {
            background-color: #dc3545;
            animation: pulse-button 1.5s infinite;
        }
        
        @keyframes pulse-button {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .mic-button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .text-box {
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="nav-brand">BMM Translation</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/speaker">Speaker</a>
                <a href="/audience">Audience</a>
                <a href="/streams">Active Streams</a>
                <a href="/contact">Contact</a>
                <a href="/account">Account</a>
            </div>
            <span id="user-email" class="user-email"></span>
            <a id="login-btn" href="/login" class="auth-button">Sign In</a>
            <a id="logout-btn" href="/logout" class="auth-button" style="display: none;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Speaker Page</h1>
        
        <div class="content-box">
            <div class="form-group">
                <label for="sourceLanguage">Your Language</label>
                <select id="sourceLanguage" class="form-control">
                    <option value="en">English</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese (Simplified)</option>
                    <option value="da">Danish</option>
                    <option value="nl">Dutch</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="hi">Hindi</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="pl">Polish</option>
                    <option value="pt">Portuguese</option>
                    <option value="ro">Romanian</option>
                    <option value="ru">Russian</option>
                    <option value="es">Spanish</option>
                    <option value="sv">Swedish</option>
                    <option value="tr">Turkish</option>
                </select>
            </div>

            <div class="audio-controls">
                <button id="micButton" class="mic-button" disabled>🎤</button>
            </div>

            <div class="form-group">
                <label>Status</label>
                <div id="status" class="status-text">Not connected</div>
            </div>
            
            <!-- Audio visualizer for feedback -->
            <div id="audioVisualizer"></div>

            <div class="form-group">
                <label>Recognized Text</label>
                <div id="recognizedText" class="text-box">
                    Your speech will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let ws = null;
        let isTranscribing = false;
        let transcriptionId = null;
        let audioContext = null;
        let mediaRecorder = null;
        let audioStream = null;
        let analyser = null;
        let visualizerContext = null;
        let animationFrame = null;
        
        // DOM elements
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const recognizedTextDiv = document.getElementById('recognizedText');
        const sourceLanguage = document.getElementById('sourceLanguage');
        const audioVisualizer = document.getElementById('audioVisualizer');
        
        // Connect to WebSocket
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const protocol = isLocalhost ? 'ws:' : 'wss:';
            const wsUrl = `${protocol}//${window.location.host}/ws?role=speaker&lang=${sourceLanguage.value}`;
            console.log('Connecting to WebSocket:', wsUrl);
            
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connection opened');
                    statusDiv.textContent = 'Connected';
                    micButton.disabled = false;
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log('Received message:', data);

                    if (data.error) {
                        console.error('Server error:', data.error);
                        statusDiv.textContent = 'Error: ' + data.error;
                        resetUI();
                        return;
                    }

                    switch(data.type) {
                        case 'connected':
                            console.log('Successfully connected to stream');
                            statusDiv.textContent = 'Connected';
                            micButton.disabled = false;
                            break;
                            
                        case 'transcriptionStarted':
                            console.log('Transcription started with ID:', data.id);
                            transcriptionId = data.id;
                            isTranscribing = true;
                            updateStatusForRecording();
                            break;
                            
                        case 'transcriptionStopped':
                            console.log('Transcription stopped');
                            isTranscribing = false;
                            transcriptionId = null;
                            statusDiv.textContent = 'Stopped';
                            break;
                            
                        case 'recognizedText':
                            // Update the recognized text display
                            recognizedTextDiv.textContent = data.text;
                            
                            // Auto-scroll to the bottom if user hasn't scrolled up
                            if (recognizedTextDiv.scrollHeight - recognizedTextDiv.scrollTop <= recognizedTextDiv.clientHeight + 50) {
                                recognizedTextDiv.scrollTop = recognizedTextDiv.scrollHeight;
                            }
                            break;
                    }
                };

                ws.onclose = (event) => {
                    console.log('WebSocket connection closed:', event);
                    statusDiv.textContent = 'Disconnected';
                    resetUI();
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    statusDiv.textContent = 'Error: Connection failed';
                    resetUI();
                };
            } catch (error) {
                console.error('Error creating WebSocket:', error);
                statusDiv.textContent = 'Error: Failed to create connection';
                resetUI();
            }
        }

        // Reset the UI elements
        function resetUI() {
            micButton.disabled = true;
            micButton.classList.remove('recording');
            recognizedTextDiv.textContent = 'Your speech will appear here...';
            stopRecording();
        }
        
        // Toggle recording state
        function toggleRecording() {
            if (isTranscribing) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        // Start recording and transcription
        async function startRecording() {
            try {
                // Request microphone access
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        channelCount: 1
                    } 
                });
                
                // Create audio context for processing
                audioContext = new AudioContext({ sampleRate: 48000 });
                
                // Set up audio visualizer
                setupAudioVisualizer(audioStream);
                
                // Create media recorder
                mediaRecorder = new MediaRecorder(audioStream, {
                    mimeType: 'audio/webm;codecs=opus',
                    audioBitsPerSecond: 128000
                });
                
                // Handle data available from recorder
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && isTranscribing) {
                        sendAudioChunk(event.data);
                    }
                };
                
                // Request transcription start from server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'startTranscription'
                    }));
                    
                    // Start recording
                    mediaRecorder.start(500); // Collect data every 500ms
                    
                    // Update UI
                    micButton.classList.add('recording');
                    recognizedTextDiv.textContent = 'Listening...';
                    
                    console.log('Recording and transcription started');
                } else {
                    alert('WebSocket connection not established. Please refresh the page.');
                    return;
                }
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Microphone access is required for transcription. Please allow microphone access and try again.');
                statusDiv.textContent = 'Error: Microphone access denied';
            }
        }
        
        // Stop recording and transcription
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            stopVisualization();
            
            // Tell the server to stop transcription
            if (ws && ws.readyState === WebSocket.OPEN && isTranscribing) {
                ws.send(JSON.stringify({
                    type: 'stopTranscription'
                }));
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            
            isTranscribing = false;
            micButton.classList.remove('recording');
            statusDiv.textContent = 'Connected';
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(err => console.error('Error closing audio context:', err));
                audioContext = null;
            }
        }
        
        // Set up the audio visualizer
        function setupAudioVisualizer(stream) {
            // Get canvas context
            const canvas = audioVisualizer;
            visualizerContext = canvas.getContext('2d');
            
            // Set up audio analyzer
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            
            // Get the buffer length and create array for frequency data
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            // Function to draw the visualization
            function drawVisualizer() {
                animationFrame = requestAnimationFrame(drawVisualizer);
                
                analyser.getByteFrequencyData(dataArray);
                
                visualizerContext.fillStyle = '#f5f5f5';
                visualizerContext.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = dataArray[i] / 2;
                    
                    visualizerContext.fillStyle = `rgb(${barHeight + 100}, 50, 50)`;
                    visualizerContext.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth + 1;
                }
            }
            
            // Start visualization
            drawVisualizer();
        }
        
        // Stop the visualization
        function stopVisualization() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
        }
        
        // Send audio data to the server
        function sendAudioChunk(blob) {
            if (!isTranscribing || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            // Convert blob to base64
            const reader = new FileReader();
            reader.onloadend = function() {
                // Get base64 data (remove the data URL prefix)
                const base64Audio = reader.result.split(',')[1];
                
                // Send to the server
                ws.send(JSON.stringify({
                    type: 'audioChunk',
                    audio: base64Audio
                }));
            };
            reader.readAsDataURL(blob);
        }
        
        // Update the status display for recording
        function updateStatusForRecording() {
            statusDiv.innerHTML = `<span class="recording-indicator"></span> <span class="status-recording">Recording</span>`;
        }
        
        // EVENT LISTENERS
        
        // Mic button click
        micButton.addEventListener('click', toggleRecording);
        
        // Language selection change
        sourceLanguage.addEventListener('change', () => {
            // If currently recording, stop it
            if (isTranscribing) {
                stopRecording();
            }
            
            // Reconnect with the new language
            connectWebSocket();
        });

        // Connect to WebSocket when page loads
        connectWebSocket();

        // Clean up on page unload
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
            
            if (isTranscribing) {
                stopRecording();
            }
        };
        
        // Session management
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const emailSpan = document.getElementById("user-email");

        // Redirect back to this page after login
        if (loginBtn) {
            loginBtn.href = `/login?from=${encodeURIComponent(window.location.pathname)}`;
        }

        fetch("/session")
            .then(res => res.json())
            .then(data => {
                if (data.email) {
                    emailSpan.textContent = data.email;
                    loginBtn.style.display = "none";
                    logoutBtn.style.display = "inline";
                } else {
                    emailSpan.textContent = "";
                    loginBtn.style.display = "inline";
                    logoutBtn.style.display = "none";
                }
            });
    </script>
</body>
</html>
